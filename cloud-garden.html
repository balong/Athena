sheet h2{margin:0;font-size:25px}.sheet>p{margin:7px 0 15px;color:var(--muted);font-size:14px}.dots{display:flex;justify-content:center;gap:16px;min-height:25px;margin:2px 0 10px}.dots span{width:15px;height:15px;border:2px solid #9fafaf;border-radius:50%}.dots span.on{border-color:var(--coral);background:var(--coral)}.msg{min-height:20px!important;margin:0 0 6px!important;color:var(--coral2)!important;font-weight:900}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.keys button{min-height:58px;border:0;border-radius:18px;background:#edf2ee;color:var(--ink);font-size:23px;font-weight:800}.keys button:active{transform:scale(.96)}.paused *{animation-play-state:paused!important}.shake{animation:shake .38s ease-in-out}

(()=>{'use strict';const $=s=>document.querySelector(s),home=$('#home'),game=$('#game'),scene=$('#scene'),start=$('#start'),sound=$('#sound'),moon=$('#moon'),gate=$('#gate'),sheet=$('#sheet'),dots=[...document.querySelectorAll('#dots span')],msg=$('#msg'),hint=$('#hint'),garden=$('#garden'),fx=$('#fx');let locked=false,hold=0,code='',count=0,audio=null,soundOn=false,last=0;const pals=[['#f4b3a6','#b96755'],['#f7d37d','#a96e28'],['#c6b5df','#6f5a9e'],['#f0a7c2','#a84f74'],['#b7d9a9','#4d7c54']],faces=['✿','✽','❀','✻','✾'],friends=['🐰','🐸','🐻','🐥','🦋'];function tone(f=392,d=.3){if(!soundOn)return;try{audio??=new(AudioContext||webkitAudioContext);const o=audio.createOscillator(),g=audio.createGain(),n=audio.currentTime;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.028,n+.03);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(n+d+.02)}catch{soundOn=false;sound.checked=false}}function point(e){const r=scene.getBoundingClientRect();return{x:Math.max(22,Math.min(r.width-22,e.clientX-r.left)),y:Math.max(42,Math.min(r.height-55,e.clientY-r.top)),h:r.height}}function ripple(x,y){const r=document.createElement('i');r.className='ripple';r.style.cssText=`left:${x}px;top:${y}px`;fx.append(r);r.onanimationend=()=>r.remove();for(let i=0;i<5;i++){const s=document.createElement('i'),a=Math.PI*2*i/5+Math.random()*.4,d=38+Math.random()*34;s.className='spark';s.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;--spark:${i%2?'#f7d37d':'#fffdf8'}`;fx.append(s);s.onanimationend=()=>s.remove()}}function bubble(x,y,f=''){const b=document.createElement('i'),z=54+Math.random()*24;b.className='bubble';b.style.cssText=`left:${x}px;top:${y}px;--size:${z}px;--drift:${-28+Math.random()*56}px`;b.textContent=f||friends[Math.floor(Math.random()*friends.length)];fx.append(b);b.onanimationend=()=>b.remove()}function flower(x,h){const f=document.createElement('i'),p=pals[count%pals.length],y=Math.max(h*.74,Math.min(h*.92,h-48));f.className='flower';f.style.cssText=`left:${x}px;top:${y-118}px;--petal:${p[0]};--dark:${p[1]}`;f.innerHTML=`<i class="stem"></i><i class="head">${faces[count%faces.length]}</i>`;garden.append(f);const all=garden.querySelectorAll('.flower');if(all.length>9)all[0].remove()}function tap(e){if(!locked||!gate.hidden)return;const n=performance.now();if(n-last<90)return;last=n;const p=point(e);count++;hint.classList.add('off');ripple(p.x,p.y);if(p.y>p.h*.58){flower(p.x,p.h);tone(330+count%5*42,.38)}else{bubble(p.x,p.y,count%3===0?friends[count%friends.length]:'');tone(392+count%4*48,.3)}}async function full(){const q=document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen;try{if(q)await q.call(document.documentElement,{navigationUI:'hide'})}catch{}}async function exitFull(){const q=document.exitFullscreen||document.webkitExitFullscreen;try{if((document.fullscreenElement||document.webkitFullscreenElement)&&q)await q.call(document)}catch{}}async function begin(){soundOn=sound.checked;locked=true;home.hidden=true;game.hidden=false;hint.classList.remove('off');await full();tone(392,.4)}function openGate(){if(!locked)return;code='';update();gate.hidden=false;scene.classList.add('paused')}function closeGate(){gate.hidden=true;scene.classList.remove('paused');code='';update()}function update(){dots.forEach((d,i)=>d.classList.toggle('on',i<code.length));msg.textContent=''}async function unlock(){locked=false;await exitFull();gate.hidden=true;game.hidden=true;home.hidden=false;scene.classList.remove('paused');code='';update()}function wrong(){msg.textContent='Try again';sheet.classList.remove('shake');void sheet.offsetWidth;sheet.classList.add('shake');setTimeout(()=>{code='';update()},520)}start.onclick=begin;scene.onpointerdown=tap;document.querySelectorAll('.friend').forEach(b=>b.onpointerdown=e=>{e.stopPropagation();if(!locked||!gate.hidden)return;const p=point(e);ripple(p.x,p.y);bubble(p.x,p.y,b.dataset.friend);tone(b.dataset.friend==='✈️'?294:523,.4)});moon.onpointerdown=e=>{e.preventDefault();e.stopPropagation();clearTimeout(hold);moon.classList.add('holding');hold=setTimeout(()=>{moon.classList.remove('holding');openGate()},2000)};['pointerup','pointercancel','pointerleave'].forEach(t=>moon.addEventListener(t,()=>{clearTimeout(hold);moon.classList.remove('holding')}));$('#keys').onclick=e=>{const k=e.target.dataset.k,a=e.target.dataset.a;if(k!==undefined){if(code.length<3){code+=k;update();if(code.length===3)setTimeout(code==='123'?unlock:wrong,100)}}else if(a==='cancel')closeGate();else if(a==='back'){code=code.slice(0,-1);update()}};document.addEventListener('touchmove',e=>{if(locked&&e.cancelable)e.preventDefault()},{passive:false});document.addEventListener('gesturestart',e=>{if(locked&&e.cancelable)e.preventDefault()},{passive:false})})();
